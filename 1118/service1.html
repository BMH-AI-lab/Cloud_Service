<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h1>1. HTML</h1>
    <h2>HyperText MarkUp Language</h2>
    <p>- 웹페이지 구조와 대응</p>

    <hr/>
    <br/>

    <h2>2. HyperText</h2>
    <ol>
        <li>웹페이지에서 다른 페이지로 연결되는 링크를 포함하는 텍스트</li>
        <li>비선형적 정보 접근 가능</li>
        <li>예: 위키피디아의 파란색 링크들</li>
    </ol>
    
    <hr/>
    <br/>

    <h2>3. MarkUp</h2>
    <ul>
        <li>태그 등을 이용하여 문서나 데이터의 구조를 평가하는 언어</li>
        <li><i>표시(Mark)를 한다(Up)는 의미</i></li>
        <li>
            <strong>문서의 구조와 의미를 표현</strong></li>
    </ul>

    </a>
